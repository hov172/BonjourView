name: BonjourView
options:
  bundleIdPrefix: com.ayalasolutions
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
targets:
  BonjourView:
    type: application
    platform: macOS
    sources:
      - path: source
      - path: nonsource
        excludes:
          - Info.plist
          - BonjourView.entitlements
      - path: LICENSE.txt
    configFiles:
      Debug: Debug.xcconfig
      Release: Release.xcconfig
    scheme:
      testTargets:
        - BonjourViewTests
      gatherCoverageData: true
  BonjourViewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: BonjourView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayalasolutions.bonjourview.tests
        GENERATE_INFOPLIST_FILE: YES
