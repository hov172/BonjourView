name: Release

# Builds, signs, notarizes and publishes BonjourView-<version>.zip and .dmg for a version tag.
# The asset names are what the AutoPkg recipes at github.com/hov172/autopkg-recipes match on.
# Required repository secrets:
#   DEVELOPER_ID_CERTIFICATE_P12   base64 of a Developer ID Application .p12
#   DEVELOPER_ID_CERTIFICATE_PASSWORD
#   DEVELOPMENT_TEAM               10-character Team ID
#   NOTARY_APPLE_ID, NOTARY_PASSWORD (app-specific password)

# Run manually from the Actions tab once the secrets exist; a tag push alone does not trigger it,
# so releases built and notarized locally with scripts/release.sh can be tagged without a failing run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v3.0.1); must match BONJOURVIEW_SHORT_VERSION in Shared.xcconfig
        required: true

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Check the tag matches the project version
        run: |
          VERSION="$(sed -n 's/^BONJOURVIEW_SHORT_VERSION = //p' Shared.xcconfig)"
          [ "${{ inputs.tag }}" = "v$VERSION" ] || { echo "Tag ${{ inputs.tag }} does not match version $VERSION" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
      - name: Build, notarize and package
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          echo "DEVELOPMENT_TEAM = ${{ secrets.DEVELOPMENT_TEAM }}" > DEVELOPMENT_TEAM.xcconfig
          scripts/release.sh
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: BonjourView ${{ env.VERSION }}
          body_path: build/release/SHA256SUMS.txt
          generate_release_notes: true
          files: |
            build/release/BonjourView-*.dmg
            build/release/BonjourView-*.zip
