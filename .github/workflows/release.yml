name: Release

# Builds, signs, notarizes and publishes Bonjeff.app when a version tag is pushed.
# Required repository secrets:
#   DEVELOPER_ID_CERTIFICATE_P12   base64 of a Developer ID Application .p12
#   DEVELOPER_ID_CERTIFICATE_PASSWORD
#   DEVELOPMENT_TEAM               10-character Team ID
#   NOTARY_APPLE_ID, NOTARY_PASSWORD (app-specific password)

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
      - name: Archive
        run: |
          echo "DEVELOPMENT_TEAM = ${{ secrets.DEVELOPMENT_TEAM }}" > DEVELOPMENT_TEAM.xcconfig
          xcodebuild archive \
            -project Bonjeff.xcodeproj \
            -scheme Bonjeff \
            -configuration Release \
            -archivePath build/Bonjeff.xcarchive \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          APP="build/Bonjeff.xcarchive/Products/Applications/Bonjeff.app"
          ditto -c -k --keepParent "$APP" build/Bonjeff.zip
          xcrun notarytool submit build/Bonjeff.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$APP"
          rm build/Bonjeff.zip
          ditto -c -k --keepParent "$APP" "build/Bonjeff-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Bonjeff-*.zip
          generate_release_notes: true
