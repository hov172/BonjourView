name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Bonjeff.xcodeproj \
            -scheme Bonjeff \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions
