name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project BonjourView.xcodeproj \
            -scheme BonjourView \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }
